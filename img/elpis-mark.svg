<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="elpis-mark-title">
	<title id="elpis-mark-title">ΕΛΠΙΣ DNS mark</title>

	<defs>
		<!-- Resolver blue, the same accent the status page and the site use -->
		<linearGradient id="elpisFlame" x1="96" y1="64" x2="416" y2="464" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#8fd0f7"/>
			<stop offset="0.45" stop-color="#2f9ee0"/>
			<stop offset="1" stop-color="#1f6fa8"/>
		</linearGradient>

		<linearGradient id="elpisSteel" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#5c6067"/>
			<stop offset="1" stop-color="#2a2d31"/>
		</linearGradient>
	</defs>

	<!-- Shield body -->
	<path
		d="M256 20 L462 106 V272 C462 372 376 452 256 492 C136 452 50 372 50 272 V106 Z"
		fill="url(#elpisSteel)"/>

	<!-- Shield edge -->
	<path
		d="M256 20 L462 106 V272 C462 372 376 452 256 492 C136 452 50 372 50 272 V106 Z"
		fill="none"
		stroke="url(#elpisFlame)"
		stroke-width="18"
		stroke-linejoin="round"/>

	<!-- Orbit / routing ring -->
	<circle cx="256" cy="252" r="150"
		fill="none"
		stroke="#8b9099"
		stroke-width="7"
		stroke-opacity="0.55"
		stroke-linecap="round"
		stroke-dasharray="46 34"/>

	<!-- Sigma: the last letter of ΕΛΠΙΣ, and the sum of every route -->
	<path
		d="M332 162 H174 L260 252 L174 342 H332"
		fill="none"
		stroke="url(#elpisFlame)"
		stroke-width="40"
		stroke-linecap="round"
		stroke-linejoin="round"/>
</svg>
