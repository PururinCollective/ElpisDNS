<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="elpis-logo-title">
	<title id="elpis-logo-title">ΕΛΠΙΣ DNS</title>

	<defs>
		<linearGradient id="logoFlame" x1="60" y1="40" x2="300" y2="300" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#ffbd4f"/>
			<stop offset="0.45" stop-color="#ff7139"/>
			<stop offset="1" stop-color="#e31587"/>
		</linearGradient>

		<linearGradient id="logoSteel" x1="40" y1="20" x2="300" y2="300" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#4b2a99"/>
			<stop offset="1" stop-color="#1d0b3d"/>
		</linearGradient>

		<style>
			/* Readable on a white README and on a dark page alike */
			.wordmark{ fill:#15141a; }
			.tagline{ fill:#6f6d79; }

			@media (prefers-color-scheme: dark){
				.wordmark{ fill:#fbfbfe; }
				.tagline{ fill:#a49cbf; }
			}
		</style>
	</defs>

	<!-- Mark -->
	<g transform="translate(40 22) scale(0.54)">
		<path
			d="M256 20 L462 106 V272 C462 372 376 452 256 492 C136 452 50 372 50 272 V106 Z"
			fill="url(#logoSteel)"/>

		<path
			d="M256 20 L462 106 V272 C462 372 376 452 256 492 C136 452 50 372 50 272 V106 Z"
			fill="none"
			stroke="url(#logoFlame)"
			stroke-width="18"
			stroke-linejoin="round"/>

		<circle cx="256" cy="252" r="150"
			fill="none"
			stroke="#cb9eff"
			stroke-width="7"
			stroke-opacity="0.55"
			stroke-linecap="round"
			stroke-dasharray="46 34"/>

		<path
			d="M332 162 H174 L260 252 L174 342 H332"
			fill="none"
			stroke="url(#logoFlame)"
			stroke-width="40"
			stroke-linecap="round"
			stroke-linejoin="round"/>
	</g>

	<!-- Wordmark -->
	<text x="360" y="168"
		class="wordmark"
		font-family="Oswald, 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif"
		font-size="118"
		font-weight="600"
		letter-spacing="10">ΕΛΠΙΣ <tspan fill="url(#logoFlame)">DNS</tspan></text>

	<text x="364" y="226"
		class="tagline"
		font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
		font-size="28"
		letter-spacing="4">BY THE COMMUNITY, FOR THE COMMUNITY.</text>
</svg>
